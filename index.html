<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense &amp; Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="js/app.js"></script>
  </head>
  <body>
    <div id="app-warning" role="alert" aria-live="polite" hidden></div>

    <header>
      <h1>Expense &amp; Budget Visualizer</h1>
    </header>

    <main>
      <!-- Input Form -->
      <section aria-labelledby="form-heading">
        <h2 id="form-heading">Add Transaction</h2>
        <form id="transaction-form" novalidate>

          <div class="form-group">
            <label for="item-name">Item Name</label>
            <input
              type="text"
              id="item-name"
              name="item-name"
              maxlength="100"
              autocomplete="off"
              aria-describedby="form-error-name"
              placeholder="e.g. Coffee"
            />
            <span id="form-error-name" class="form-error" role="alert" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="amount">Amount ($)</label>
            <input
              type="number"
              id="amount"
              name="amount"
              min="0.01"
              max="999999999.99"
              step="0.01"
              aria-describedby="form-error-amount"
              placeholder="e.g. 12.50"
            />
            <span id="form-error-amount" class="form-error" role="alert" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select
              id="category"
              name="category"
              aria-describedby="form-error-category"
            >
              <option value="">-- Select a category --</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
            <span id="form-error-category" class="form-error" role="alert" aria-live="polite"></span>
          </div>

          <button type="submit">Add Transaction</button>
        </form>
      </section>

      <!-- Balance Display -->
      <section aria-labelledby="balance-heading">
        <h2 id="balance-heading">Total Balance</h2>
        <p id="balance-display">$0.00</p>
      </section>

      <!-- Transaction List -->
      <section aria-labelledby="list-heading">
        <h2 id="list-heading">Transactions</h2>
        <ul id="transaction-list" aria-label="Transaction list"></ul>
      </section>

      <!-- Spending Chart -->
      <section aria-labelledby="chart-heading">
        <h2 id="chart-heading">Spending by Category</h2>
        <canvas
          id="chart-canvas"
          role="img"
          aria-label="Spending distribution by category pie chart"
        ></canvas>
      </section>
    </main>
  </body>
</html>
